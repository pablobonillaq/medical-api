name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    name: Lint, types, tests and SonarQube
    runs-on: ubuntu-latest

    # A PostgreSQL only for this job, used by the integration tests
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: medical
          POSTGRES_PASSWORD: medical
          POSTGRES_DB: medical_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medical -d medical_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://medical:medical@localhost:5432/medical_api_test?schema=public
      DATABASE_URL: postgresql://medical:medical@localhost:5432/medical_api_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # SonarQube needs the full history to know which code is new
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check .

      - name: Tests with coverage (unit and integration)
        run: npm run test:coverage

      - name: SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
