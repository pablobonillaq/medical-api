# Keys shown by SonarQube Cloud when you created the project
sonar.organization=pablobonillaq
sonar.projectKey=pablobonillaq_medical-api
sonar.projectName=Medical API

# Application code (tests and generated code are not part of it)
sonar.sources=src
sonar.exclusions=src/**/*.test.ts,src/test/**,src/generated/**

# Test code
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/test/**

# Coverage report generated by Vitest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/types/**,src/index.ts,src/db/seed.ts
