services:
  db:
    image: postgres:18
    container_name: medical-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    # Catches every email in development: nothing leaves your computer
  mail:
    image: axllent/mailpit:latest
    container_name: medical-mail
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP: where the API sends emails
      - '8025:8025' # Web inbox: http://localhost:8025
volumes:
  pgdata:
