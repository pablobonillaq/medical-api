<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clinic chat (demo)</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --panel: #ffffff;
        --text: #1d2733;
        --muted: #6b7785;
        --border: #dde3e9;
        --accent: #0f766e;
        --mine: #d9f2ee;
        --theirs: #eef1f4;
        --danger: #b42318;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.45 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        font-size: 17px;
        margin: 0;
        flex: 1;
      }
      .pill {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--theirs);
        color: var(--muted);
      }
      .pill.online {
        background: var(--mine);
        color: var(--accent);
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      input {
        font: inherit;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        width: 100%;
      }
      .error {
        color: var(--danger);
        min-height: 1.4em;
      }
      [hidden] {
        display: none !important;
      }
      #login {
        max-width: 340px;
        margin: 48px auto;
        display: grid;
        gap: 10px;
        background: var(--panel);
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      #app {
        display: grid;
        grid-template-columns: 260px 1fr;
        height: calc(100vh - 53px);
      }
      #app.patient {
        grid-template-columns: 1fr;
      }
      #inbox {
        border-right: 1px solid var(--border);
        background: var(--panel);
        overflow-y: auto;
      }
      #inbox button {
        display: flex;
        justify-content: space-between;
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        text-align: left;
        padding: 12px;
      }
      #inbox button.active {
        background: var(--mine);
      }
      .badge {
        background: var(--accent);
        color: #fff;
        border-radius: 999px;
        padding: 0 7px;
        font-size: 12px;
      }
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #conversationHeader {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      #conversationTitle {
        flex: 1;
        font-weight: 600;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .message {
        max-width: 70%;
        padding: 8px 12px;
        border-radius: 10px;
        background: var(--theirs);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .message.mine {
        align-self: flex-end;
        background: var(--mine);
      }
      .message small {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      #typing {
        padding: 0 16px;
        color: var(--muted);
        font-style: italic;
        min-height: 1.4em;
      }
      #composer {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        background: var(--panel);
        border-top: 1px solid var(--border);
      }
      .empty {
        color: var(--muted);
        text-align: center;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Clinic chat <span class="pill">demo</span></h1>
      <span id="status" class="pill">offline</span>
      <span id="whoami"></span>
      <button id="logout" hidden>Log out</button>
    </header>

    <form id="login" hidden>
      <strong>Log in as a patient or front desk employee</strong>
      <input id="email" type="email" placeholder="Email" autocomplete="username" required />
      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      />
      <button class="primary">Log in</button>
      <div id="loginError" class="error"></div>
    </form>

    <div id="app" hidden>
      <nav id="inbox" aria-label="Conversations"></nav>
      <main>
        <div id="conversationHeader">
          <span id="conversationTitle">Select a conversation</span>
          <span id="readInfo" class="pill" hidden></span>
          <button id="toggleStatus" hidden></button>
        </div>
        <div id="messages"><p class="empty">No messages yet</p></div>
        <div id="typing"></div>
        <form id="composer">
          <input id="body" placeholder="Write a message…" maxlength="2000" autocomplete="off" />
          <button class="primary">Send</button>
        </form>
        <div id="chatError" class="error" style="padding: 0 16px 8px"></div>
      </main>
    </div>

    <!-- Socket.IO serves its browser client at this path -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- The page script is a separate file: the Content-Security-Policy blocks inline scripts -->
    <script src="chat.js"></script>
  </body>
</html>
